<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雾港 · 同层卡示例</title>
<style>/*__FRAME_CSS__*/</style></head><body>
<header class="sl-topbar"><div class="sl-identity"><div class="sl-seal" aria-hidden="true">雾</div><div><div class="eyebrow">FOG HARBOR · <span id="mode">正在连接</span></div><h1>雾港寻物</h1></div></div><div class="sl-top-actions"><span class="sl-online" id="connection">正在连接</span><button id="theme-toggle" class="secondary">浅色</button><button id="menu-open" class="secondary" aria-expanded="false" aria-controls="feature-nav">功能菜单</button></div></header><nav id="feature-nav" aria-label="聊天功能" hidden></nav>
<p id="notice" role="status" aria-live="polite">正在等待宿主连接……</p>
<main class="sl-layout"><section class="panel sl-chat"><div class="sl-channel"><div><div class="eyebrow">CONVERSATION / 港口频道</div><h2>潮声里的故事</h2></div><span id="message-count" class="sl-badge">正在读取</span></div><div id="messages" aria-live="polite"></div><div class="sl-composer-wrap"><div id="composer"><label class="sl-visually-hidden" for="text">发送内容</label><textarea id="text" placeholder="想说些什么？" maxlength="15000"></textarea><button type="button" id="send" disabled>发送</button></div><div id="composer-tools"><div id="models-slot"></div></div><p class="sl-composer-note">写下此刻的回应，让故事继续。指令和原生功能位于上方菜单。</p></div></section>
<section class="panel" id="game-panel"><div class="eyebrow">FIELD NOTES / 游戏模块</div><h2>寻物手记</h2><p class="muted">雾灯亮起时，沿着码头走走。每次探索都会留下新的收获。</p><p id="game-error"></p><div class="stats"><div class="stat">回合<strong id="turn">—</strong></div><div class="stat">体力<strong id="energy">—</strong></div><div class="stat">金币<strong id="coins">—</strong></div></div><div class="actions"><button id="explore" disabled>出发探索</button><button id="rest" class="secondary" disabled>休息</button></div><ul class="log" id="receipts"></ul><button id="narrate" class="secondary" disabled>请 AI 描写这次行动</button><p id="ledger" class="muted"></p><hr><div class="actions"><button id="export" class="secondary" disabled>导出进度</button><button id="import" class="secondary" disabled>导入进度</button><input id="file" type="file" accept="application/json,.json" hidden></div><p class="muted">进度保存在当前浏览器。换设备前请导出文件。</p></section></main>
<footer>独立页面 · 原生聊天 · 可选规则引擎</footer>
<dialog id="confirm"><h2>恢复这份进度？</h2><p>将替换当前游戏进度，并保留恢复前的本地备份。</p><div class="actions"><button id="confirm-import">恢复进度</button><button id="cancel-import" class="secondary">取消</button></div></dialog>
<script>/*__FRAME_JS__*/</script></body></html>
